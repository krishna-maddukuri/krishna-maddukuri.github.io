  <body>
    <div id="root"></div>
    <!-- shown only where there is no pre-built page (the 404 page, the dev server) and the page's script is
         switched off or fails to download: who he is and how to reach him. A pre-built page shows itself
         instead (scripts/prerender.mjs swaps this block for a style that reveals what waits for the script) -->
    <noscript id="boot-fallback">
      <div style="min-height: 100vh; display: grid; place-content: center; gap: 14px; padding: 32px; background: #000; color: #f1f1f3; font: 16px/1.5 system-ui, sans-serif">

        <a href="https://www.linkedin.com/in/krishna-koushik" style="color: #f0412e">linkedin.com/in/krishna-koushik</a>
        <a href="/Krishna_Koushik_Maddukuri_Resume.pdf" style="color: #f0412e">Resume (PDF)</a>
      </div>
    </noscript>
    <script>
      ;(function () {
        var shown = false
        function show() {
          if (shown) return
          var root = document.getElementById('root')
          // a pre-built page is already on screen: show the parts that were waiting for the script
          if (root && root.childNodes.length) return document.documentElement.classList.add('script-failed')
          shown = true
          // with script on, a noscript element holds its markup as text
          var box = document.createElement('div')
          box.innerHTML = document.getElementById('boot-fallback').textContent
          document.body.appendChild(box)
        }
        // the page's script, or a file it needs, failed to download
        window.addEventListener('error', function (e) { if (e.target && e.target.tagName === 'SCRIPT') show() }, true)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>

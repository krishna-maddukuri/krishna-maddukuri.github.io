# Runs the end-to-end tests: on every commit to main, on every pull request, by hand from the
# Actions tab, and as the first step of publishing (deploy.yml calls this file and only publishes
# when it passes), so a change that breaks something on the site shows up as a red cross and
# never goes live.
name: End-to-end tests

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
  # lets deploy.yml run these tests before it publishes
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # a run takes about 18 minutes here (these machines draw the page in software)
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Build and test
        run: npm run test:e2e
        env:
          CI: true
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

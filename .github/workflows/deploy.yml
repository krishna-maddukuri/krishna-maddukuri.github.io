# Publishes the site to GitHub Pages. It runs only when it is started by hand (Actions tab >
# "Deploy site to GitHub Pages" > Run workflow), and it publishes only once the end-to-end
# tests have passed on that commit (a failing test stops it: whatever is live stays as it was).
# It installs the exact package versions in package-lock.json, builds the site
# (npm run build -> dist/) for the address GitHub Pages gives this repository, and puts dist/ live.
# Repo setting this needs: Settings > Pages > Source = GitHub Actions.
# To publish on every commit to main instead, add these two lines under "on:" below
# and take the same two lines out of test.yml (publishing already runs the tests):
#   push:
#     branches: ['main']
name: Deploy site to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If it is started twice close together, only the newest run gets published
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # the same tests as test.yml; nothing below runs unless they pass
  test:
    name: End-to-end tests
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # asks GitHub Pages where this repository's site is served
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build
        run: npm run build
        env:
          # the site's address and its sub-path: "/" for a <username>.github.io repository or a
          # domain of its own, "/<repository>/" for any other repository
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
